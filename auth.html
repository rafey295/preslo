<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Log In or Sign Up — Preslo</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><text y=%2220%22 font-size=%2220%22>📄</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-shell">

  <header class="topbar">
    <div class="topbar-left">
      <a href="index.html" class="logo">Pres<span>lo</span></a>
    </div>
    <div class="topbar-right">
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <div class="body-shell">
    <main class="main-content full-width auth-page-main">

      <div class="auth-card">
        <div class="auth-tabs">
          <button class="auth-tab active" data-tab="login">Log In</button>
          <button class="auth-tab" data-tab="signup">Sign Up</button>
        </div>

        <form class="auth-form" id="loginForm">
          <label>Email
            <input type="email" id="loginEmail" required />
          </label>
          <label>Password
            <input type="password" id="loginPassword" required minlength="6" />
          </label>
          <div class="auth-error" id="loginError" style="display:none;"></div>
          <button type="submit" class="btn" id="loginSubmit">Log In</button>
        </form>

        <form class="auth-form" id="signupForm" style="display:none;">
          <div class="avatar-upload-row">
            <div class="avatar-preview" id="avatarPreview">+</div>
            <div>
              <button type="button" class="btn-ghost avatar-upload-btn" id="avatarUploadBtn">Add photo</button>
              <div class="avatar-upload-hint">Optional</div>
            </div>
            <input type="file" id="avatarFileInput" accept="image/png,image/jpeg" style="display:none;" />
          </div>

          <label>Name
            <input type="text" id="signupName" required />
          </label>
          <label>Email
            <input type="email" id="signupEmail" required />
          </label>
          <label>Password
            <input type="password" id="signupPassword" required minlength="6" />
          </label>
          <div class="auth-error" id="signupError" style="display:none;"></div>
          <button type="submit" class="btn" id="signupSubmit">Sign Up</button>
        </form>
      </div>

    </main>
  </div>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-col">
        <div class="logo">Pres<span>lo</span></div>
        <p>Simple, private tools that run entirely on your device.</p>
      </div>
      <div class="footer-col">
        <h4>Company</h4>
        <a href="about.html">About Us</a>
        <a href="contact.html">Contact Us</a>
      </div>
      <div class="footer-col">
        <h4>Legal</h4>
        <a href="privacy.html">Privacy Policy</a>
        <a href="terms.html">Terms of Service</a>
        <a href="disclaimer.html">Disclaimer</a>
      </div>
      <div class="footer-col">
        <h4>Follow</h4>
        <a href="#">Facebook</a>
        <a href="#">Instagram</a>
        <a href="#">YouTube</a>
      </div>
    </div>
    <div class="footer-bottom">© 2026 Preslo. All rights reserved.</div>
  </footer>

</div>

<script src="ui.js"></script>
<script type="module" src="firebase-config.js"></script>
<script type="module" src="auth.js"></script>
<script type="module" src="auth-page.js"></script>
</body>
</html>
